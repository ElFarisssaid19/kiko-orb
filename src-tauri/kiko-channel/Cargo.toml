[package]
name = "kiko-channel"
version = "0.1.0"
description = "Kiko's Claude Code channel: a stdio MCP server that brings Kiko's chat messages into a session"
authors = ["you"]
edition = "2024"

# Claude Code starts one of these per session: keep it small and free of GUI libraries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
